[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msra"
version = "2.0.0"
description = "Android APK security vulnerability scanner - Slay vulnerabilities before they slay your users"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sai Jagadeesh"}
]
keywords = ["android", "apk", "security", "vulnerability", "scanner", "pentesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "flask>=3.0.0",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40.0"]
test = ["pytest>=8.0"]
dynamic = [
    "uiautomator2>=3.0.0",
    "frida-tools>=12.0.0",
    "mitmproxy>=10.0.0",
]
pdf = [
    "weasyprint>=60.0",
]

[project.scripts]
msra = "msra.cli:main"

[project.urls]
Homepage = "https://github.com/BaymaxPop23/MSRA"
Repository = "https://github.com/BaymaxPop23/MSRA"
Issues = "https://github.com/BaymaxPop23/MSRA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["msra*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
