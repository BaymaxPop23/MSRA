services:
  msra:
    build: .
    container_name: msra
    ports:
      # Loopback only by default. To expose on the network, set MSRA_BIND=0.0.0.0
      # AND MSRA_AUTH_TOKEN (the app has no other authentication).
      - "${MSRA_BIND:-127.0.0.1}:5001:5001"
    volumes:
      # Persist scan data, reports, user config and the SQLite DB across restarts
      - msra_uploads:/app/uploads
      - msra_reports:/app/reports
      - msra_data:/app/data/custom
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MSRA_AUTH_TOKEN=${MSRA_AUTH_TOKEN:-}
      - PORT=5001
    restart: unless-stopped

volumes:
  msra_uploads:
  msra_reports:
  msra_data:
